name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: "빌드 유형 선택 (debug: 테스트용 즉시 빌드, release: 배포용 서명 키 필요)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +e
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_ROOT/licenses/android-sdk-preview-license"
          SDKMANAGER="$(command -v sdkmanager 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ] && [ -d "$SDK_ROOT/cmdline-tools" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Ensure Gradle 9.3.1 is on PATH
        shell: bash
        run: |
          if ! command -v gradle >/dev/null 2>&1 || ! gradle --version 2>/dev/null | grep -q "Gradle 9.3.1"; then
            curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle-9.3.1.zip
            unzip -q -o /tmp/gradle-9.3.1.zip -d /tmp/gradle-9.3.1
            echo "/tmp/gradle-9.3.1/gradle-9.3.1/bin" >> "$GITHUB_PATH"
          fi

      - name: Prepare debug keystore
        shell: bash
        run: |
          if [ -s debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Build Debug APK
        if: ${{ inputs.build_type != 'release' }}
        run: gradle :app:assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Upload Debug APK
        if: ${{ inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v6
        with:
          name: senior-health-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Release APK
        id: release
        if: ${{ inputs.build_type == 'release' || github.event_name == 'push' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_TYPE: ${{ inputs.build_type }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            if [ "$BUILD_TYPE" = "release" ]; then
              echo "Release 빌드를 위해서는 GitHub Secrets에 KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD를 등록해야 합니다."
              exit 1
            fi
            echo "Release 서명 키가 설정되지 않아 Debug APK만 빌드합니다."
            echo "built_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE_PATH"
          gradle :app:assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"
          echo "built_release=true" >> "$GITHUB_OUTPUT"

      - name: Upload Release APK
        if: ${{ steps.release.outputs.built_release == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: senior-health-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Clean up release keystore
        if: always()
        run: rm -f my-upload-key.jks
